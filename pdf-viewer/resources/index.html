<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>NeutralinoJs</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="neutralinoapp">

      <!--Probably should make this a file menu at some point -->
      <div id="toolbar">
        <button onclick="getFile()">Select PDF</button>
        <button onclick="savePDF()">Save PDF</button>
      </div>

      <div id="pdf-container">
        <!-- Embedded PDF.js viewer: text selection, form filling, and annotation editing. "?file=" keeps it from loading a default document -->
        <iframe id="pdf-frame" src="pdfjs/web/viewer.html?file=" title="PDF viewer"></iframe>
      </div>

    </div>
    <script src="js/neutralino.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
